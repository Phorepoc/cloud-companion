include:
  - docker-compose.hub.yml   # profile "hub" (Stalwart + Z-Push) and "hub-legacy"; see README, "Hub"
services:
  phecloud:
    build: .
    image: phe-cloud:dev
    container_name: phe-cloud
    cpus: 2
    mem_limit: 2g
    shm_size: 512m
    ports:
      # the phone port (TLS 1.3, paired devices only) is open to the network; the web app (plain HTTP) is on this machine only: put a TLS proxy in front of it
      # for anything else (profile "tls", docs/reverse-proxy.md), or set PHECLOUD_WEB_BIND=0.0.0.0 on a network you trust
      - "${PHECLOUD_PHONE_BIND:-0.0.0.0}:7400:7400"
      - "${PHECLOUD_WEB_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - phecloud-data:/data
    env_file:
      - path: deploy/hub/.env.phecloud   # written by deploy/hub/hub-init.sh; optional
        required: false
    environment:
      # behind a reverse proxy: its address(es), so its X-Forwarded-* headers are believed (docs/reverse-proxy.md); empty = trust nobody
      PHECLOUD_TRUSTED_PROXIES: ${PHECLOUD_TRUSTED_PROXIES:-}
      # the database: a SQLite file (default), or postgres://... / mysql://... (docker-compose.db.yml, docs/database.md)
      PHECLOUD_DB: ${PHECLOUD_DB:-/data/phecloud.db}
      # "Sign in with Google / Microsoft" on the Connections page: your own OAuth client registrations (docs/connections.md); empty = not offered
      PHECLOUD_ANDROID_SECRET: ${PHECLOUD_ANDROID_SECRET:-}
      PHECLOUD_OAUTH_GOOGLE_ID: ${PHECLOUD_OAUTH_GOOGLE_ID:-}
      PHECLOUD_OAUTH_GOOGLE_SECRET: ${PHECLOUD_OAUTH_GOOGLE_SECRET:-}
      PHECLOUD_OAUTH_MS_ID: ${PHECLOUD_OAUTH_MS_ID:-}
      PHECLOUD_OAUTH_MS_SECRET: ${PHECLOUD_OAUTH_MS_SECRET:-}
      PHECLOUD_OAUTH_MS_TENANT: ${PHECLOUD_OAUTH_MS_TENANT:-common}
      PHECLOUD_PUBLIC_URL: ${PHECLOUD_PUBLIC_URL:-}
    restart: unless-stopped
    # environment:
    #   PHECLOUD_PLAIN_LISTEN: ":7401"   # development only: plain TCP for client/test/run.sh
  # TLS reverse proxy for the web app: docker compose --profile tls up -d   (see README, "HTTPS")
  caddy:
    profiles: ["tls"]
    image: caddy:2
    container_name: phe-caddy
    cpus: 1
    mem_limit: 256m
    environment:
      PHECLOUD_DOMAIN: ${PHECLOUD_DOMAIN:-localhost}
    ports:
      - "${PHECLOUD_HTTPS_PORT:-443}:443"
    volumes:
      - ${CADDYFILE:-./deploy/Caddyfile.local}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - phecloud
    restart: unless-stopped
volumes:
  caddy-data:
  phecloud-data:
