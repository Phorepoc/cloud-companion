services:
  phecloud:
    build: .
    image: phe-cloud:dev
    container_name: phe-cloud
    cpus: 2
    mem_limit: 2g
    shm_size: 512m
    ports:
      - "7400:7400"
      - "8080:8080"
    volumes:
      - phecloud-data:/data
    restart: unless-stopped
    # environment:
    #   PHECLOUD_PLAIN_LISTEN: ":7401"   # development only: plain TCP for client/test/run.sh
volumes:
  phecloud-data:
