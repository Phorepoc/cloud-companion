# On a board set up by the host manager (docs/host-manager.md) only: the manager's socket for the owner's Features and System pages.
# The manager adds this file itself (deploy/features/core.yaml); a server set up by hand does not use it.
services:
  phecloud:
    volumes:
      - /run/phehost:/run/phehost
