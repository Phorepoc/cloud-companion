# SPDX-License-Identifier: Apache-2.0
# On a board set up by the host manager (docs/host-manager.md) only: the manager's socket for the owner's Features and System pages,
# and the first owner's code the setup page hands over. The manager adds this file itself (deploy/features/core.yaml); a server set
# up by hand does not use it.
services:
  phecloud:
    volumes:
      - /run/phehost:/run/phehost
    environment:
      PHECLOUD_FIRST_OWNER_CODE: ${PHECLOUD_FIRST_OWNER_CODE:-}
