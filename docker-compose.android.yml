# Android in the browser (docs/android.md): a Redroid container and the pheandroid stream bridge. Optional; start with  --profile android
#   docker compose -f docker-compose.yml -f docker-compose.hub.yml -f docker-compose.android.yml --profile hub --profile tls --profile android up -d --build
# Needs on the host: the binder_linux kernel module; an image from deploy/android/Dockerfile.redroid-native (build it from the upstream Redroid image yourself);
# the scrcpy server jar (Apache-2.0, https://github.com/Genymobile/scrcpy/releases, scrcpy-server-v<version>) on the host, nothing of either is shipped here.
# Also set PHECLOUD_ANDROID_SECRET (any long random string) for phecloud and the bridge.
services:
  redroid:
    profiles: ["android"]
    image: ${PHE_REDROID_IMAGE:-phe-redroid-native:13}
    container_name: phe-redroid
    privileged: true            # Redroid needs it (binder, mounts); the only privileged container of the stack, on an internal network
    cpus: ${PHE_REDROID_CPUS:-2}
    mem_limit: ${PHE_REDROID_MEM:-3g}
    command: ["androidboot.redroid_width=720", "androidboot.redroid_height=1280", "androidboot.redroid_dpi=320", "androidboot.use_memfd=1"]
    volumes:
      - redroid-data:/data
    restart: unless-stopped
  # Parking: the bridge stops the Android container after PHE_ANDROID_PARK_AFTER without a viewer and starts it with the next one. It talks to Docker only through this
  # proxy, which allows container start / stop / pause / inspect and nothing else (no create, exec, images, volumes).
  dockerproxy:
    profiles: ["android"]
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: phe-dockerproxy
    cpus: 0.25
    mem_limit: 64m
    environment:
      CONTAINERS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
  android:
    profiles: ["android"]
    build:
      context: .
      dockerfile: cmd/pheandroid/Dockerfile
    image: phe-android-bridge:dev
    container_name: phe-android
    cpus: 1
    mem_limit: 256m
    environment:
      PHE_ANDROID_SECRET: ${PHECLOUD_ANDROID_SECRET:?set PHECLOUD_ANDROID_SECRET}
      PHE_ANDROID_SERIAL: phe-redroid:5555
      PHE_ANDROID_DOCKER: http://dockerproxy:2375
      PHE_ANDROID_CONTAINER: phe-redroid
      PHE_ANDROID_PARK_AFTER: ${PHE_ANDROID_PARK_AFTER:-15m}   # 0 turns parking off
      PHE_ANDROID_PARK: ${PHE_ANDROID_PARK:-stop}
      PHE_ANDROID_SCRCPY_VERSION: ${PHE_SCRCPY_VERSION:-5.0.1}
    volumes:
      - ${PHE_SCRCPY_JAR:?path of the scrcpy server jar on the host}:/scrcpy-server.jar:ro
    depends_on:
      - redroid
      - dockerproxy
    restart: unless-stopped
volumes:
  redroid-data:
