# SPDX-License-Identifier: AGPL-3.0-only
id: postgres
title: PostgreSQL database
about: "Stores Cloud Companion's data in PostgreSQL instead of the built-in SQLite database. Useful for many users or large mailboxes."
files: [docker-compose.db.yml]
profiles: [db-postgres]
conflicts: [mariadb]
needs: { memory: 256M }
settings:
  - { key: password, label: Database password, env: PHECLOUD_DB_PASSWORD, generate: true, secret: true }
env:
  PHECLOUD_DB: postgres://phecloud:${PHECLOUD_DB_PASSWORD}@postgres:5432/phecloud?sslmode=disable
