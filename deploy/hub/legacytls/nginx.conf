# SPDX-License-Identifier: Apache-2.0
worker_processes 1;
events { worker_connections 256; }
http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server {
        listen 8443 ssl;
        ssl_certificate /data/server.crt;
        ssl_certificate_key /data/server.key;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers 'AES128-SHA:AES256-SHA:AES128-SHA256:AES256-SHA256:DES-CBC3-SHA:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers off;
        client_max_body_size 64m;
        location /Microsoft-Server-ActiveSync {
            proxy_pass http://zpush:80;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }
        location = /ca.crt { alias /data/ca.crt; }
        location = /ca.cer { alias /data/ca.cer; default_type application/x-x509-ca-cert; }
    }
}
