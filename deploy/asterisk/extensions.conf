; phecloud-asterisk (docs/messaging.md). Messages go to the account of that name (an extension, or cloud-companion, which passes
; them on through your routing rules); calls ring that extension.
[general]
static=yes
writeprotect=no

[messages]
exten => _X.,1,MessageSend(pjsip:${EXTEN},${MESSAGE(from)})
 same => n,Hangup()
exten => _[a-z].,1,MessageSend(pjsip:${EXTEN},${MESSAGE(from)})
 same => n,Hangup()

[calls]
exten => _X.,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
