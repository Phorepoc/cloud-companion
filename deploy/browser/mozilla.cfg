// Firefox behind the Browser page (first line of this file is skipped by Firefox)
// The page's own UI replaces these popups; passwords will live in Cloud Companion, not in this container.
lockPref("browser.download.alwaysOpenPanel", false);
lockPref("signon.rememberSignons", false);
// downloads go straight to Files, Downloads (a volume shared with Cloud Companion), without asking where or what to do
lockPref("browser.download.folderList", 2);
lockPref("browser.download.dir", "/home/neko/Downloads");
lockPref("browser.download.useDownloadDir", true);
lockPref("browser.download.always_ask_before_handling_new_types", false);
lockPref("browser.download.start_downloads_in_tmp_dir", false);
lockPref("pdfjs.disabled", false);
try {
  // Firefox's window has a minimum width (about 450 px, for its toolbars, hidden here): without it the window follows a phone's
  // narrow screen instead of running past its right edge
  const sss = Components.classes["@mozilla.org/content/style-sheet-service;1"].getService(Components.interfaces.nsIStyleSheetService);
  sss.loadAndRegisterSheet(Services.io.newURI("data:text/css," + encodeURIComponent(
    "@-moz-document url-prefix(chrome://browser/content/browser.xhtml) { :root, #navigator-toolbox, #nav-bar, #TabsToolbar { min-width: 0 !important; min-height: 0 !important } }")), sss.USER_SHEET);
} catch (e) { Components.utils.reportError(e); }
try {
  // Firefox's address bar is hidden but keeps the keys after a navigation: they belong to the page
  const keep = [];
  Services.obs.addObserver((win) => {
    const l = {
      onLocationChange() { win.gBrowser.selectedBrowser.focus(); },
      QueryInterface: ChromeUtils.generateQI(["nsIWebProgressListener", "nsISupportsWeakReference"]),
    };
    keep.push(l);
    win.gBrowser.addProgressListener(l);
  }, "browser-delayed-startup-finished");
} catch (e) { Components.utils.reportError(e); }
