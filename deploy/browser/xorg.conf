# Xorg for the Browser page's Firefox (from Neko's, with more screen sizes). Generated by hand from a list of sizes:
# phones in portrait (360-432 wide, in steps of 40 high), tablets in portrait, and landscape from 640x360 to 3840x2160, so the
# picture fits a phone or a window closely; the horizontal blank keeps every mode's clock above the dummy driver's minimum
# (browserEngine.ts fitScreen picks the largest that fits). 30 frames a second (25 at 4K).

Section "ServerFlags"
  Option "DontVTSwitch" "true"
  Option "AllowMouseOpenFail" "true"
  Option "PciForceNone" "true"
  Option "AutoEnableDevices" "false"
  Option "AutoAddDevices" "false"
EndSection

Section "InputDevice"
  Identifier "dummy_mouse"
  Option "CorePointer" "true"
  Driver "void"
EndSection

Section "InputDevice"
  Identifier "dummy_keyboard"
  Option "CoreKeyboard" "true"
  Driver "void"
EndSection

Section "InputDevice"
  Identifier "dummy_touchscreen"
  Option "SendCoreEvents" "On"
  Option "SocketName" "/tmp/xf86-input-neko.sock"
  Driver "neko"
EndSection

Section "Device"
  Identifier "dummy_videocard"
  Driver "dummy"
  Option "ConstantDPI" "true"
  VideoRam 1024000
  #VideoRam 512000
  #VideoRam 256000
  #VideoRam 192000
EndSection

