# SPDX-License-Identifier: Apache-2.0
# DRAFT release workflow: builds the container images and, only when asked, pushes them to ghcr.io. Nothing is pushed by default:
#   - a tag push (v*) builds the images and does NOT push;
#   - "Run workflow" (workflow_dispatch) with push=true builds and pushes (needs the repository's packages permission).
# Before the first real release: decide the image names and platforms, check NOTICE against the current dependency list, and remove the guard below.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the images to ghcr.io (default: build only)'
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: phecloud
            file: Dockerfile
          - name: phecloud-android-bridge
            file: cmd/pheandroid/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: image name (lower case, as the registry needs)
        id: img
        run: echo "ref=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.img.outputs.ref }}
          tags: |
            type=ref,event=tag
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/login-action@v3
        if: ${{ inputs.push == true }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ inputs.push == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
