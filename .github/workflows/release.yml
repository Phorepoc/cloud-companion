# SPDX-License-Identifier: AGPL-3.0-only
# Releases. Every push to main runs the checks (ci.yml). When they pass, go-semantic-release reads the Conventional Commits since the last tag
# (feat = minor, fix = patch, breaking = major; with allow-initial-development-versions a breaking change is only a minor bump below 1.0; docs, chore, ci, ... release nothing;
# the first release is v0.1.0), makes the tag and the GitHub release with generated notes, and only when it published a version are both container images built and pushed
# to ghcr.io/phorepoc/<name> as vX.Y.Z, vX.Y and latest. A pull request never reaches this workflow.
name: Release
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]   # documentation alone releases nothing
  workflow_dispatch:
permissions:
  contents: read
# one release run at a time, in push order: each works out its version from the tags the previous one made
concurrency:
  group: release
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0   # go-semantic-release needs the full tag history, not a shallow clone
      - name: Install semantic-release
        run: |
          curl -fsSL -o "$RUNNER_TEMP/semantic-release" https://github.com/go-semantic-release/semantic-release/releases/download/v2.31.0/semantic-release_v2.31.0_linux_amd64
          echo "b8f518b1aeb1d1742f4e6e91a179b707cea4309a64fe3854f465bf724f04f6d3  $RUNNER_TEMP/semantic-release" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/semantic-release"
      - name: Release
        id: semrel
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f   # v1
        with:
          allow-initial-development-versions: 'true'
          bin: ${{ runner.temp }}/semantic-release   # the pinned binary from the step above (the action would download whatever is latest)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: phecloud
            file: Dockerfile
            platforms: linux/amd64,linux/arm64   # arm64: the Raspberry Pi boards (docs/host-manager.md)
          - name: phecloud-android-bridge
            file: cmd/pheandroid/Dockerfile
            platforms: linux/amd64               # the Android feature needs an x86 machine
          # the hub's and the phone service's own images: a board pulls them like the others (no build tools on it)
          - name: phecloud-zpush
            context: deploy/hub/zpush
            platforms: linux/amd64,linux/arm64
          - name: phecloud-legacytls
            context: deploy/hub/legacytls
            platforms: linux/amd64,linux/arm64
          - name: phecloud-asterisk
            context: deploy/asterisk
            platforms: linux/amd64,linux/arm64
          - name: phecloud-browser                 # Firefox with Neko's stream (the Browser feature)
            context: deploy/browser
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130   # v3.7.0: the arm64 image's runtime stage
        if: contains(matrix.platforms, 'arm64')
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f   # v3
      - name: Image name
        id: img
        run: echo "ref=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051   # v5
        id: meta
        with:
          images: ${{ steps.img.outputs.ref }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=v${{ needs.release.outputs.version }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9   # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.file && matrix.file || format('{0}/Dockerfile', matrix.context) }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          secrets: github_packages_token=${{ secrets.GITHUB_TOKEN }}   # the Etesian design packages for the web app

  # The board files (deploy/board/bundle.sh) and the Raspberry Pi image (deploy/images/pi), on the same release page, only when
  # this release changed something of theirs: install.sh finds the newest release that has them.
  board-changed:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - name: Changes since the last release
        id: diff
        run: |
          tag=v${{ needs.release.outputs.version }}
          prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          if [ -z "$prev" ] || ! git diff --quiet "$prev" "$tag" -- cmd/phehost internal/host deploy/board deploy/features deploy/images 'docker-compose*.yml'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  board:
    needs: [release, board-changed]
    if: needs.board-changed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff   # v5
        with:
          go-version-file: go.mod
      - name: Board files
        env:
          GOFLAGS: -tags=goolm
        run: sh deploy/board/bundle.sh out "v${{ needs.release.outputs.version }}"
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.release.outputs.version }}" out/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: board
          path: out/

  pi-image:
    needs: [release, board]
    runs-on: ubuntu-24.04-arm   # native arm64: no emulation
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: board
          path: board
      - name: Image
        run: sh deploy/images/pi/build.sh board
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd deploy/images/pi/deploy
          for f in *.img.xz; do mv "$f" "cloud-companion-raspberry-pi-v${{ needs.release.outputs.version }}.img.xz"; done
          sha256sum ./*.img.xz | sed "s|  ./|  |" > SHA256SUMS.image
          gh release upload "v${{ needs.release.outputs.version }}" ./*.img.xz SHA256SUMS.image
