# SPDX-License-Identifier: AGPL-3.0-only
# CI on a plain Linux runner. Everything here runs without Redroid, a GPU, a phone or any secret. (The Android stream suite, web/test/android.sh, needs the binder kernel module and
# a Docker host you control: run it there, see docs/android.md.)
name: CI
on:
  # no push trigger: a push to main runs these checks once, inside the release workflow (which calls this one before it releases)
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  packages: read   # the Etesian design packages (GitHub Packages) for the web app
env:
  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}   # (a call from the release workflow is its own group)
  cancel-in-progress: true

jobs:
  commits:
    name: Commit lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 22
      - name: Install commitlint
        run: npm ci --no-audit --no-fund
      - name: Lint pushed commits
        if: github.event_name == 'push'
        # a force push leaves "before" outside the new history: lint from where the two histories meet then
        run: |
          from=${{ github.event.before }}
          if ! git merge-base --is-ancestor "$from" ${{ github.sha }} 2>/dev/null; then
            from=$(git merge-base "$from" ${{ github.sha }} 2>/dev/null || git rev-parse ${{ github.sha }}~1)
          fi
          npx commitlint --from "$from" --to ${{ github.sha }} --verbose
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  go:
    name: Go
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=goolm   # Matrix encryption in pure Go (mautrix-go): no cgo, no libolm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff   # v5
        with:
          go-version-file: go.mod
      - name: Create web dist placeholder
        run: mkdir -p internal/webui/dist && touch internal/webui/dist/placeholder.txt
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: Check licenses
        run: |
          # segmentio/asm (via gotd/td) is MIT-0, which go-licenses does not recognise; checked by hand
          # github.com/phorepoc/cloud-companion is this repository itself (AGPL-3.0-only), not a third-party dependency
          go install github.com/google/go-licenses@v1.6.0
          go-licenses check ./cmd/... --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0 --ignore modernc.org/mathutil --ignore github.com/segmentio/asm --ignore github.com/phorepoc/cloud-companion

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f   # v3
      # built once here: the browser jobs load these, and the release reuses the layers (same cache scope)
      - name: Build phecloud
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6
        with:
          context: .
          load: true
          tags: phe-cloud:dev
          cache-from: type=gha,scope=phecloud
          cache-to: type=gha,mode=max,scope=phecloud
          secrets: github_packages_token=${{ secrets.GITHUB_TOKEN }}
      - name: Build fakes
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6
        with:
          context: .
          target: fakes
          load: true
          tags: phe-fakes:dev
          cache-from: type=gha,scope=phecloud
          secrets: github_packages_token=${{ secrets.GITHUB_TOKEN }}
      - name: Build Android bridge
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6
        with:
          context: .
          file: cmd/pheandroid/Dockerfile
          cache-from: type=gha,scope=phecloud-android-bridge
          cache-to: type=gha,mode=max,scope=phecloud-android-bridge
      - name: Smoke test image
        run: |
          docker run -d --name ci-cloud -p 127.0.0.1:8080:8080 phe-cloud:dev
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          curl -fsSI http://127.0.0.1:8080/ | grep -i "content-security-policy"
          docker cp ci-cloud:/etc/ssl/certs/ca-certificates.crt ca.crt && test -s ca.crt   # the image is FROM scratch: no shell or test inside
          docker logs ci-cloud | tail -5
      - name: Save images
        run: docker save phe-cloud:dev phe-fakes:dev | gzip -1 > images.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: images
          path: images.tar.gz
          retention-days: 1

  browser-types:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund && npm run check   # the app's types, and the compiled stream.js and sw.js up to date
        working-directory: web
      - run: npm install --no-audit --no-fund && npm run check
        working-directory: web/test

  # the browser suites in four groups, on the images built above (no suite builds). Matrix, IRC and Nextcloud Talk have the
  # same connection dialog as XMPP, so only XMPP runs here; all of them run against the real services in integration.yml.
  browser:
    name: Browser (${{ matrix.group }})
    needs: images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: desktop
            suites: desktop widgets feeds settings shapes
          - group: sign-in
            suites: csp passkey oauth proxy
          - group: chats
            suites: chats routing sipservice xmpp xmppfront telegram signal
          - group: files
            suites: remotefiles photos dav
    env:
      PHE_UP: --no-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: images
      - name: Load images
        run: gunzip -c images.tar.gz | docker load
      - name: Run suites
        run: |
          fail=0
          for s in ${{ matrix.suites }}; do
            echo "::group::$s"
            sh web/test/$s.sh || { fail=1; echo "::error::$s failed"; }
            echo "::endgroup::"
          done
          exit $fail
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: always()
        with:
          name: shots-${{ matrix.group }}
          path: web/test/out/*.png
          if-no-files-found: ignore

  # the Browser page against real Firefox (deploy/browser), its image built here with its own cache
  browser-engine:
    name: Browser (Firefox)
    needs: images
    runs-on: ubuntu-latest
    env:
      PHE_UP: --no-build
      PHECLOUD_VERSION: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f   # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: images
      - name: Load images
        run: gunzip -c images.tar.gz | docker load
      - name: Build the browser
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6
        with:
          context: deploy/browser
          load: true
          tags: ghcr.io/phorepoc/phecloud-browser:ci
          cache-from: type=gha,scope=phecloud-browser
          cache-to: type=gha,mode=max,scope=phecloud-browser
      - name: Run the suite
        run: sh web/test/browser.sh
      - name: The phone link on the same Firefox
        run: sh web/test/phonebrowser.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: always()
        with:
          name: shots-firefox
          path: web/test/out/browser-*.png
          if-no-files-found: ignore

  # the SQL on PostgreSQL and MariaDB: every package whose tests open a store (SQLite runs in the Go job)
  databases:
    name: Go databases
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=goolm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: pw
        ports: ["3306:3306"]
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff   # v5
        with:
          go-version-file: go.mod
      - name: Create web dist placeholder
        run: mkdir -p internal/webui/dist && touch internal/webui/dist/placeholder.txt
      - name: Find packages with a store
        run: echo "PKGS=$(grep -rl 'OpenTest(t)' internal --include=*_test.go | xargs -n1 dirname | sort -u | sed 's#^#./#' | tr '\n' ' ')" >> "$GITHUB_ENV"
      - name: PostgreSQL
        run: |
          # shellcheck disable=SC2086 # PKGS is a list of packages
          go test -count=1 $PKGS
        env:
          PHECLOUD_TEST_DB: postgres://postgres:pw@127.0.0.1:5432/postgres?sslmode=disable
      - name: MariaDB
        run: |
          # shellcheck disable=SC2086 # PKGS is a list of packages
          go test -count=1 $PKGS
        env:
          PHECLOUD_TEST_DB: mysql://root:pw@127.0.0.1:3306/mysql

  client:
    name: C client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc make
      - run: make -C client check
