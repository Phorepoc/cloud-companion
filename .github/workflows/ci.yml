# SPDX-License-Identifier: Apache-2.0
# CI on a plain Linux runner. Everything here runs without Redroid, a GPU, a phone or any secret. (The Android stream suite, web/test/android.sh, needs the binder kernel module and
# a Docker host you control: run it there, see docs/android.md.)
name: ci
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:   # the release workflow runs the same checks before it builds the images
permissions:
  contents: read
  packages: read   # the Etesian design packages (GitHub Packages) for the web app
env:
  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}   # (a call from the release workflow is its own group)
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages are Conventional Commits (the release reads them)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: .github/commitlint
      - name: lint the commits of the pull request / of the push
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then from=$BASE; else from=$BEFORE; fi
          case "$from" in ''|0000000000000000000000000000000000000000) from="$SHA~1" ;; esac
          cd .github/commitlint && npx commitlint --config "$GITHUB_WORKSPACE/.github/commitlint/commitlint.config.js" --cwd "$GITHUB_WORKSPACE" --from "$from" --to "$SHA" --verbose

  go:
    name: "Go: format, vet, tests (SQLite), licences"
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=goolm   # Matrix encryption in pure Go (mautrix-go): no cgo, no libolm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff   # v5
        with:
          go-version-file: go.mod
      - name: the embedded web app directory must exist for the build
        run: mkdir -p internal/webui/dist && touch internal/webui/dist/placeholder.txt
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: dependency licences (allow-list; see NOTICE)
        run: |
          # segmentio/asm (via gotd/td) is MIT-0, which go-licenses does not recognise; checked by hand
          go install github.com/google/go-licenses@v1.6.0
          go-licenses check ./cmd/... --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0 --ignore modernc.org/mathutil --ignore github.com/segmentio/asm

  images:
    name: Container images build (phecloud with the web app, Android bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - run: docker build --secret id=github_packages_token,env=GITHUB_PACKAGES_TOKEN -t phe-cloud:ci .
      - run: docker build -t phe-android-bridge:ci -f cmd/pheandroid/Dockerfile .
      - name: the image starts and answers
        run: |
          docker run -d --name ci-cloud -p 127.0.0.1:8080:8080 phe-cloud:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          curl -fsSI http://127.0.0.1:8080/ | grep -i "content-security-policy"
          docker logs ci-cloud | tail -5

  browser-types:
    name: "Browser tests: TypeScript check (all of them, the Android ones included)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund && npm run check   # the app's types, and the compiled stream.js and sw.js up to date
        working-directory: web
      - run: npm install --no-audit --no-fund && npm run check
        working-directory: web/test

  browser:
    name: Browser suite (${{ matrix.script }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [csp.sh, desktop.sh, passkey.sh, chats.sh, oauth.sh, proxy.sh, routing.sh, sipservice.sh, matrix.sh, xmpp.sh, xmppfront.sh, irc.sh, nctalk.sh, signal.sh, telegram.sh, remotefiles.sh, photos.sh, dav.sh]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - run: sh web/test/${{ matrix.script }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: always()
        with:
          name: shots-${{ matrix.script }}
          path: web/test/out/*.png
          if-no-files-found: ignore

  services:
    name: Chat connections against real services (Asterisk, a Matrix homeserver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - run: sh deploy/asterisk/test.sh
      - run: sh testdata/matrix/test.sh
      - run: sh testdata/xmpp/test.sh
      - run: sh testdata/irc/test.sh
      - run: sh testdata/nctalk/test.sh
      - run: sh testdata/remote/test.sh
      - run: sh testdata/immich/test.sh
      - run: sh testdata/dlna/test.sh
      - run: sh testdata/signal/test.sh

  databases:
    name: Go tests on PostgreSQL and MariaDB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - run: sh web/test/db_test.sh postgres
      - run: sh web/test/db_test.sh mariadb

  client:
    name: C client core (self-test, sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc make
      - run: make -C client check
