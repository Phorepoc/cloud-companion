# SPDX-License-Identifier: Apache-2.0
# CI on a plain Linux runner. Everything here runs without Redroid, a GPU, a phone or any secret. (The Android stream suite, web/test/android.sh, needs the binder kernel module and
# a Docker host you control: run it there, see docs/android.md.)
name: CI
on:
  # no push trigger: a push to main runs these checks once, inside the release workflow (which calls this one before it releases)
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  packages: read   # the Etesian design packages (GitHub Packages) for the web app
env:
  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}   # (a call from the release workflow is its own group)
  cancel-in-progress: true

jobs:
  commits:
    name: Commit lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 22
      - name: Install commitlint
        run: npm ci --no-audit --no-fund
      - name: Lint pushed commits
        if: github.event_name == 'push'
        run: npx commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  go:
    name: Go
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=goolm   # Matrix encryption in pure Go (mautrix-go): no cgo, no libolm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff   # v5
        with:
          go-version-file: go.mod
      - name: Create web dist placeholder
        run: mkdir -p internal/webui/dist && touch internal/webui/dist/placeholder.txt
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: Check licenses
        run: |
          # segmentio/asm (via gotd/td) is MIT-0, which go-licenses does not recognise; checked by hand
          go install github.com/google/go-licenses@v1.6.0
          go-licenses check ./cmd/... --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0 --ignore modernc.org/mathutil --ignore github.com/segmentio/asm

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - run: docker build --secret id=github_packages_token,env=GITHUB_PACKAGES_TOKEN -t phe-cloud:ci .
      - run: docker build -t phe-android-bridge:ci -f cmd/pheandroid/Dockerfile .
      - name: Smoke test image
        run: |
          docker run -d --name ci-cloud -p 127.0.0.1:8080:8080 phe-cloud:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          curl -fsSI http://127.0.0.1:8080/ | grep -i "content-security-policy"
          docker exec ci-cloud test -s /etc/ssl/certs/ca-certificates.crt
          docker logs ci-cloud | tail -5

  browser-types:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund && npm run check   # the app's types, and the compiled stream.js and sw.js up to date
        working-directory: web
      - run: npm install --no-audit --no-fund && npm run check
        working-directory: web/test

  browser:
    name: Browser (${{ matrix.script }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [csp.sh, desktop.sh, settings.sh, browserinput.sh, widgets.sh, feeds.sh, shapes.sh, passkey.sh, chats.sh, oauth.sh, proxy.sh, routing.sh, sipservice.sh, matrix.sh, xmpp.sh, xmppfront.sh, irc.sh, nctalk.sh, signal.sh, telegram.sh, remotefiles.sh, photos.sh, dav.sh]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - run: sh web/test/${{ matrix.script }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: always()
        with:
          name: shots-${{ matrix.script }}
          path: web/test/out/*.png
          if-no-files-found: ignore

  databases:
    name: Go databases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - run: sh web/test/db_test.sh postgres
      - run: sh web/test/db_test.sh mariadb

  client:
    name: C client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc make
      - run: make -C client check
