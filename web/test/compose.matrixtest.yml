# web/test/matrix.sh: a throwaway Matrix homeserver (Conduit, Apache-2.0) next to the test Cloud Companion, no host ports
services:
  conduit:
    image: matrixconduit/matrix-conduit:v0.10.15
    container_name: phe-conduit-ui
    cpus: 1
    mem_limit: 512m
    environment:
      CONDUIT_CONFIG: ""
      CONDUIT_SERVER_NAME: test.local
      CONDUIT_DATABASE_PATH: /tmp
      CONDUIT_DATABASE_BACKEND: rocksdb
      CONDUIT_PORT: "6167"
      CONDUIT_ADDRESS: 0.0.0.0
      CONDUIT_ALLOW_REGISTRATION: "true"
      CONDUIT_ALLOW_FEDERATION: "false"
