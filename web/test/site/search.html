<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search</title></head>
<body style="margin:0;font:32px sans-serif;background:#fff8e1"><h1 style="margin:20px">Search result</h1><p style="margin:20px">You searched for:</p><p id="q" style="margin:20px;font-size:44px;color:#b00"></p>
<script>document.getElementById('q').textContent=decodeURIComponent((location.search.match(/q=([^&]*)/)||[,''])[1].replace(/\+/g,' '))</script></body></html>
