<!-- The browser's typing test (browserinput.ts): a search box like Google's (a textarea that searches on Enter). It counts the key
     presses it gets and reports in the title what a page's own scripts can see of us. -->
<meta name="viewport" content="width=device-width">
<title>Typing</title>
<textarea id="q" rows="1" style="width:300px;font:20px sans-serif"></textarea>
<script>
  let keys = 0
  const q = document.getElementById('q')
  q.addEventListener('keydown', (e) => {
    keys++
    if (e.key !== 'Enter') return
    e.preventDefault()
    const marks = document.querySelectorAll('[data-phe-id],[data-phe-layer],#phe-hide').length
    document.title = JSON.stringify({ q: q.value, keys, trusted: e.isTrusted, marks, globals: Object.keys(window).filter((k) => /phe/i.test(k)) })
  })
</script>
