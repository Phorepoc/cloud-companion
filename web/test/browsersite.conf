# the Browser test's site: static pages, and one that shows the User-Agent header Firefox sent
server {
    listen 80;
    # a certificate nobody vouches for (made for the test, web/test/browsersite-tls): Firefox refuses it
    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    root /usr/share/nginx/html;
    location = /phe-download.txt {
        default_type text/plain;
        add_header Content-Disposition 'attachment; filename="phe-download.txt"';
        return 200 "downloaded through the Browser page\n";
    }
    location = /ua {
        default_type text/html;
        return 200 "<!doctype html><title>ua</title><p id=h>$http_user_agent</p><p id=j></p><script>document.getElementById('j').textContent=navigator.userAgent;document.title=(/Android/.test('$http_user_agent')?'header-mobile':'header-desktop')+' '+(/Android/.test(navigator.userAgent)?'script-mobile':'script-desktop')</script>";
    }
}
