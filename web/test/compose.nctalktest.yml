# web/test/nctalk.sh: a throwaway Nextcloud with Talk (official image, SQLite) next to the test Cloud Companion, no host ports
services:
  nextcloud:
    image: nextcloud:35.0.2-apache
    container_name: phe-nc-ui
    cpus: 2
    mem_limit: 1g
    environment:
      SQLITE_DATABASE: nc
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin-pw-12345
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud
