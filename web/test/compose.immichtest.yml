# web/test/photos.sh: a throwaway Immich (official images, machine learning off) next to the test Cloud Companion, no host ports
services:
  immich:
    image: ghcr.io/immich-app/immich-server:v3.3.6
    container_name: phe-im-ui
    cpus: 2
    mem_limit: 2g
    environment:
      DB_HOSTNAME: immich-db
      DB_PASSWORD: pg-pw-12345
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      IMMICH_MACHINE_LEARNING_ENABLED: "false"
    restart: on-failure
    depends_on:
      immich-db: { condition: service_healthy }
      immich-redis: { condition: service_started }
  immich-db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    mem_limit: 1g
    environment:
      POSTGRES_PASSWORD: pg-pw-12345
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
  immich-redis:
    image: valkey/valkey:9
    mem_limit: 128m
