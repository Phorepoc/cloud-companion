<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Android</title>
<style>
:root { --bg:#f4f5f7; --fg:#1b1f24; --muted:#5b6672; --card:#ffffff; --line:#d5dae0; --accent:#1a5fb4; }
@media (prefers-color-scheme: dark) { :root { --bg:#14171a; --fg:#e8eaed; --muted:#9aa4af; --card:#1d2227; --line:#323a42; --accent:#7ab0ff; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:12px 16px; gap:10px; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; }
button, .b { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 14px; min-height:44px; cursor:pointer; display:inline-flex; align-items:center; }
button:focus-visible, canvas:focus-visible, label:focus-within .b { outline:3px solid var(--accent); outline-offset:2px; }
#screen { background:#000; border:1px solid var(--line); border-radius:10px; max-width:100%; max-height:calc(100vh - 190px); touch-action:none; cursor:pointer; }
#info, #msg { color:var(--muted); font-size:14px; text-align:center; min-height:1.4em; }
input[type=text] { font:inherit; padding:8px; min-height:44px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
</style>
</head>
<body>
<h1 style="font-size:1.1rem;margin:0">Android</h1>
<div class="row" role="toolbar" aria-label="Android keys">
  <button data-k="4">Back</button><button data-k="3">Home</button><button data-k="187">Recent</button>
  <button id="sound" aria-pressed="false">Sound off</button>
  <button id="copyfrom">Copy from phone</button><button id="pasteto">Paste to phone</button>
  <button id="reconnect">Reconnect</button>
</div>
<div class="row" role="group" aria-label="Install apps">
  <label style="cursor:pointer"><input id="apk" type="file" accept=".apk,application/vnd.android.package-archive" hidden><span class="b">Install an APK file</span></label>
  <input id="pkg" type="text" placeholder="F-Droid package, e.g. org.fossify.notes" aria-label="F-Droid package name" size="34" autocomplete="off" spellcheck="false">
  <button id="fd">Install from F-Droid</button>
</div>
<div id="msg" role="status"></div>
<canvas id="screen" width="360" height="640" tabindex="0" role="application" aria-label="Android screen: click or touch to tap, type to enter text"></canvas>
<div id="info" role="status">Connecting</div>
<script type="module">
// The standalone page: the same module the web app uses (stream.js), with plain controls around it.
import { AndroidStream } from './stream.js'
const $ = (id) => document.getElementById(id), q = new URLSearchParams(location.search)
let last = {}
const show = () => {
  const s = stream.state, bits = []
  if (s === 'starting') { $('info').textContent = 'Starting Android… (it was switched off to save resources)'; return }
  if (s !== 'live') { $('info').textContent = s === 'connecting' ? 'Connecting' : (last.msg || 'Disconnected.') + ' Open this page again from Phecloud.'; return }
  bits.push('connected ' + last.w + 'x' + last.h)
  if (last.fps !== undefined) bits.push(last.fps.toFixed(0) + ' fps', last.kbps.toFixed(0) + ' kbit/s')
  if (last.i2f_n) bits.push('input to next frame ' + last.i2f_ms.toFixed(0) + ' ms')
  bits.push('round trip ' + last.rtt.toFixed(0) + ' ms')
  $('info').textContent = bits.join(' · ')
}
const stream = new AndroidStream($('screen'), {
  base: './',
  onState: (s, m) => { last.msg = m; show() },
  onStats: (m) => { last = { ...last, ...m }; show() },
  onNote: (t) => { $('msg').textContent = t },
})
const connect = () => stream.connect(q.get('t') || '', { codec: q.get('codec'), size: q.get('size'), fps: q.get('fps'), kbps: q.get('kbps'), kind: q.get('kind'), audio: q.get('audio') !== '0' })
document.querySelectorAll('button[data-k]').forEach((b) => b.addEventListener('click', () => stream.key(+b.dataset.k)))
$('sound').addEventListener('click', (e) => { const on = !stream.soundOn; stream.setSound(on); e.target.textContent = on ? 'Sound on' : 'Sound off'; e.target.setAttribute('aria-pressed', String(on)) })
$('copyfrom').addEventListener('click', () => stream.copyFromPhone())
$('pasteto').addEventListener('click', () => stream.pasteToPhone())
$('reconnect').addEventListener('click', connect)
$('apk').addEventListener('change', (e) => { const f = e.target.files[0]; if (f) stream.installApk(f); e.target.value = '' })
$('fd').addEventListener('click', () => { const id = $('pkg').value.trim(); if (id) stream.installFdroid(id) })
connect()
</script>
</body>
</html>
